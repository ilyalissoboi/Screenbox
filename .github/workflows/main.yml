name: Windows Release Builder

on:
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'

jobs:
  xaml-lint:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run XAML style check
        run: .\scripts\lint-xaml.ps1

  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-test-${{ hashFiles('**/*.csproj', 'AirPlay.Package.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-test-

      - name: Get the SendAirPlay2 package
        run: .\scripts\Get-AirPlayPackage.ps1

      - name: Build tests
        run: msbuild Screenbox.Core.Tests\Screenbox.Core.Tests.csproj -p:Configuration=Release -p:Platform=x64 -p:OutDir=C:\BuildOutput\ -restore

      - name: Run tests
        run: C:\BuildOutput\Screenbox.Core.Tests.exe

  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'AirPlay.Package.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Get the SendAirPlay2 package
        run: .\scripts\Get-AirPlayPackage.ps1

      - name: Extract version from tag
        id: tag-version
        if: github.ref_type == 'tag'
        run: |
          $found = "${{ github.ref_name }}" -match 'v*(\d+.\d+.\d+)'
          if ($found) { $match = $matches[1] }
          "version=$match" >> $env:GITHUB_OUTPUT

      - name: Update package manifest
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            .\scripts\Update-AppxManifest.ps1
          } else {
            .\scripts\Update-AppxManifest.ps1 -Identity SideloadUnsigned
          }

      - name: Update project version
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            .\scripts\Update-ProjectVersion.ps1 -Version "${{ steps.tag-version.outputs.version }}.0"
          } else {
            .\scripts\Update-ProjectVersion.ps1
          }

      - name: Update secrets file
        if: github.ref_type == 'tag'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          .\scripts\Set-Secrets.ps1 -SentryDsn "$env:SENTRY_DSN"

      - name: Build app package
        env:
          PackageDir: C:\DeployOutput\
          SENTRY_ORG: starpine
          SENTRY_PROJECT: screenbox
          SENTRY_URL: https://sentry.io/
          SENTRY_RELEASE: screenbox@${{ steps.tag-version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $buildMode = "StoreUpload"
            $sentryArgs = "-p:SentryUploadSymbols=true", `
                          "-p:SentryOrg=$env:SENTRY_ORG", `
                          "-p:SentryProject=$env:SENTRY_PROJECT", `
                          "-p:SentryUrl=$env:SENTRY_URL", `
                          "-p:SentryCreateRelease=true", `
                          "-p:SentrySetCommits=true"
          }
          else {
            $buildMode = "SideloadOnly"
            $sentryArgs = @()
          }

          msbuild Screenbox\Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageDir=$env:PackageDir `
            -p:UapAppxPackageBuildMode=$buildMode `
            @sentryArgs

      - name: Upload Store submission package artifact
        uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          path: C:\DeployOutput\*.msixupload
          archive: false

      - name: Upload sideload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-sideload
          path: |
            C:\DeployOutput\*_Test\
            !C:\DeployOutput\*_Test\*.msix
          compression-level: 0

  airplay-stereo-aac:
    # Experimental x64 validation does not participate in tag publication.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-stereo-aac-${{ hashFiles('**/*.csproj', 'AirPlay.Package.props') }}

      - name: Verify both package pins and profile refusals
        run: |
          .\scripts\Get-AirPlayPackage.ps1
          .\scripts\Get-AirPlayPackage.ps1 -StereoAac -Platform x64
          .\scripts\Test-AirPlayPackage.ps1

      - name: Build and run opt-in logic tests
        run: |
          msbuild Screenbox.Core.Tests\Screenbox.Core.Tests.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:AirPlayStereoAac=true -p:OutDir=C:\AudioTests\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          C:\AudioTests\Screenbox.Core.Tests.exe

      - name: Configure sideload identity and version
        run: |
          .\scripts\Update-AppxManifest.ps1 -Identity SideloadUnsigned
          .\scripts\Update-ProjectVersion.ps1

      - name: Build opt-in x64 app package
        run: |
          msbuild Screenbox\Screenbox.csproj -restore -p:RestoreConfigFile=nuget.config -p:ContinuousIntegrationBuild=true -p:Configuration=Release -p:Platform=x64 -p:AirPlayStereoAac=true -p:AppxBundle=Never -p:AppxPackageDir=C:\AudioDeploy\ -p:UapAppxPackageBuildMode=SideloadOnly

      - name: Verify packaged DLLs and complete source and notices
        run: |
          $packages = @(Get-ChildItem C:\AudioDeploy -Recurse -Filter '*Screenbox*.msix')
          if ($packages.Count -ne 1) { throw 'Expected exactly one x64 app MSIX.' }
          [IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, 'C:\AudioLayout')
          .\scripts\Test-AirPlayDistribution.ps1 -StereoAac -LayoutDirectory C:\AudioLayout

      - name: Upload experimental x64 sideload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-airplay-stereo-aac-x64
          path: C:\AudioDeploy\
          compression-level: 0

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download sideload package artifact
        uses: actions/download-artifact@v8
        with:
          name: Screenbox-sideload
          path: ${{ github.workspace }}/Downloads
          skip-decompress: true

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/Downloads/Screenbox-sideload.zip
